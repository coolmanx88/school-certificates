name: Publish school portal
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript
        run: |
          node --check app.js
          node --check launch.js
          node scripts/build-apps-script.mjs
          cp apps-script/Code.gs /tmp/school-code.js
          node --check /tmp/school-code.js
      - name: Test Apps Script permissions
        run: node scripts/test-apps-script.mjs
      - name: Prepare public files
        run: |
          mkdir public
          cp index.html admin.html launch.js config.js public/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
