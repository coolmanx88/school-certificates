<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>body{font:15px Tahoma,Arial;line-height:1.8;padding:20px;color:#15362f}button{background:#126b53;color:white;padding:12px 22px;border:0;border-radius:8px;cursor:pointer}button:disabled{opacity:.5}</style></head><body><h2>تفعيل حسابات الدخول</h2><p>تُحوّل كلمات المرور المؤقتة إلى بصمات ثم تُمسح من جدول الإدخال. احتفظ بملف Excel الخاص لتسليم كلمات المرور المؤقتة لكل معلم.</p><button id="start">بدء التفعيل</button><p id="status" role="status"></p><script>
const setupToken='<?!= token ?>';
const call=(path,body={})=>new Promise((resolve,reject)=>google.script.run.withSuccessHandler(r=>r.status===200?resolve(r.data):reject(Error(r.data.error))).withFailureHandler(()=>reject(Error('تعذر التفعيل.'))).rpc({path,body,setupToken}));
document.getElementById('start').onclick=async()=>{const b=document.getElementById('start'),s=document.getElementById('status');b.disabled=true;try{const {entries,rounds}=await call('/setup/pending'),output=[];for(let i=0;i<entries.length;i++){s.textContent='تجهيز الحساب '+(i+1)+' من '+entries.length;const e=entries[i],key=await crypto.subtle.importKey('raw',new TextEncoder().encode(e.password),'PBKDF2',false,['deriveBits']);const value=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(e.salt),iterations:rounds,hash:'SHA-256'},key,256);output.push({row:e.row,salt:e.salt,verifier:Array.from(new Uint8Array(value),b=>b.toString(16).padStart(2,'0')).join('')});e.password='';}const r=await call('/setup/commit',{entries:output});s.textContent='تم تفعيل '+r.count+' حسابًا. كلمات المرور المؤقتة مُسحت من جدول الإدخال.';}catch(e){s.textContent=e.message;b.disabled=false;}};
</script></body></html>
